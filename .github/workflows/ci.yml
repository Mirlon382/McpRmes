name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version the Dockerfile builds with, so CI and the image use the same uv.
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
          enable-cache: true

      # --locked fails when uv.lock does not match pyproject.toml, instead of silently re-resolving:
      # the point of CI is to run the versions somebody tested.
      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # The suite never reaches INSEE: the SPARQL client is exercised through an httpx.MockTransport.
      - name: Tests
        run: uv run pytest -q

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # No push: this only proves the Dockerfile still builds. APP_VERSION is the arg the
      # Dockerfile expects a release to pass in.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
